<!DOCTYPE html>
<html lang="tr">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2HBENM0X4S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-2HBENM0X4S');
    </script>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Küçük Bir Soru... 😉</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form name="randevu-formu" method="POST" data-netlify="true" id="appointment-form">
        <input type="hidden" name="form-name" value="randevu-formu" />
        
        <div id="step-1" class="step active unboxed">
            <h1 class="main-title">ÇIKALIM MI?</h1>
            <div class="buttons-wrapper">
                <button type="button" id="yes-btn" onclick="nextStep(2)">EVET</button>
                <button type="button" id="no-btn">HAYIR</button>
            </div>
        </div>

        <div id="step-2" class="step unboxed">
            <h1 class="main-title" style="font-size: 2.5rem;">WUHUHUHUHUHHUUH! 🥳</h1>
            <h3 style="color: #e91e63; margin-bottom: 25px; font-size: 1.5rem;">Peki ne yapmak istersin?</h3>
            
            <input type="hidden" name="kategori" id="selected-category" value="">
            
            <div class="category-buttons">
                <button type="button" class="sub-btn" onclick="selectCategory('Besle Beni 🍕')">BESLE BENİ</button>
                <button type="button" class="sub-btn" onclick="selectCategory('Çay & Kahve & Tatlı ☕')">ÇAY KAHVE TATLI</button>
                <button type="button" class="sub-btn" onclick="selectCategory('Hepsi! ✨')">HEPSİ</button>
            </div>
        </div>

        <div id="step-3" class="step unboxed">
            <h1 class="main-title" style="font-size: 2.5rem;">MÜKEMMEL! 🗓️</h1>
            <h3 style="color: #e91e63; margin-bottom: 20px; font-size: 1.3rem;">Zamanı ayarlayalım:</h3>
            
            <div class="inputs-container">
                <label class="input-label">Müsait Olduğun Günler:</label>
                <input type="text" name="musait_gunler" class="input-field" placeholder="Örn: Hafta sonu, Pazartesi veya Çarşamba" required>
                
                <label class="input-label">İş Çıkış Saatlerin:</label>
                <input type="text" name="cikis_saati" class="input-field" placeholder="Örn: 18:30'dan sonra, tüm gün" required>
                
                <button type="submit" class="submit-btn">Planı Tamamla! 🚀</button>
            </div>
        </div>

        <div id="step-4" class="step unboxed">
            <h1 class="main-title" style="font-size: 3rem; color: #4CAF50;">PLAN HAZIR! 🍑✨</h1>
            <h2 style="color: #e91e63; margin-top: 20px;">Bilgiler bana ışık hızıyla ulaştı. Sabırsızlıkla bekliyorum! En yakın zamanda sendeyim.</h2>
        </div>

    </form>

    <script>
        const noBtn = document.getElementById('no-btn');
        const form = document.getElementById('appointment-form');
        
        // Kaçan Buton Fonksiyonu (PC & Mobil Uyumlu)
        function butonunKacmasi() {
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            
            const randomX = Math.floor(Math.random() * Math.max(10, maxX));
            const randomY = Math.floor(Math.random() * Math.max(10, maxY));
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        noBtn.addEventListener('mouseover', butonunKacmasi);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            butonunKacmasi();
        });

        // 🍑 Şeftali Emojisi Konfeti Ayarı
        const seftali = confetti.shapeFromText({ text: '🍑', scalar: 4 });
        let rainInterval;

        function seftaliYagmuru() {
            rainInterval = setInterval(() => {
                confetti({
                    particleCount: 2,
                    angle: 270,
                    spread: 80,
                    origin: { x: Math.random(), y: -0.1 },
                    shapes: [seftali],
                    scalar: Math.random() * 2 + 2,
                    gravity: 0.7,
                    ticks: 350
                });
            }, 200);
        }

        // Adımlar Arası Geçiş
        function nextStep(stepNumber) {
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('active');
            });
            document.getElementById('step-' + stepNumber).classList.add('active');

            if(stepNumber === 2 && !rainInterval) {
                seftaliYagmuru(); // Evet deyince şeftaliler yağmaya başlar
            }
        }

        // Kategori Seçimi
        function selectCategory(categoryName) {
            document.getElementById('selected-category').value = categoryName;
            nextStep(3); // Direkt 3. adıma zıplar
        }

        // Formu Arka Planda (AJAX) Gönderme Sihri
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Sayfa yenilenmesini engelle
            
            const formData = new FormData(form);
            
            fetch('/', {
                method: 'POST',
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams(formData).toString()
            })
            .then(() => {
                // Gönderim başarılı olunca çılgın bir bitiş patlaması yap ve 4. adıma geç
                confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
                nextStep(4);
            })
            .catch((error) => {
                alert("Ufak bir hata oluştu dostum, tekrar dener misin?: " + error);
            });
        });
    </script>
</body>
</html>
