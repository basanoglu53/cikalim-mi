<!DOCTYPE html>
<html lang="tr">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2HBENM0X4S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-2HBENM0X4S');
    </script>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Küçük Bir Soru... 😉</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form name="randevu-formu" method="POST" data-netlify="true" id="appointment-form">
        
        <div id="step-1" class="step active">
            <h1 class="main-title">ÇIKALIM MI?</h1>
            <div class="buttons-wrapper">
                <button type="button" id="yes-btn" onclick="nextStep(2)">EVET</button>
                <button type="button" id="no-btn">HAYIR</button>
            </div>
        </div>

        <div id="step-2" class="step">
            </div>

        <div id="step-3" class="step">
            </div>

    </form>

    <script>
        const noBtn = document.getElementById('no-btn');
        
        // Kaçan Buton Fonksiyonu (Hem PC hem Telefon uyumlu)
        function butonunKacmasi() {
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            
            const randomX = Math.floor(Math.random() * Math.max(10, maxX));
            const randomY = Math.floor(Math.random() * Math.max(10, maxY));
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Bilgisayarlar için fare gelince kaç
        noBtn.addEventListener('mouseover', butonunKacmasi);

        // Telefonlar için parmak dokununca kaç
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Dokunup tıklamasını engeller, direkt kaçırır
            butonunKacmasi();
        });

        // Adımlar Arası Geçiş Fonksiyonu
        function nextStep(stepNumber) {
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('active');
            });
            document.getElementById('step-' + stepNumber).classList.add('active');

            // EVET'e basılınca ilk konfeti patlaması
            if(stepNumber === 2) {
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            }
        }
    </script>
</body>
</html>
