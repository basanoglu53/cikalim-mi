<!DOCTYPE html>
<html lang="tr">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2HBENM0X4S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-2HBENM0X4S');
    </script>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Küçük Bir Soru... 😉</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form name="randevu-formu" method="POST" data-netlify="true" id="appointment-form">
        
        <div id="step-1" class="step active">
            <h1 class="main-title">ÇIKALIM MI?</h1>
            <div class="buttons-wrapper">
                <button type="button" id="yes-btn" onclick="nextStep(2)">EVET</button>
                <button type="button" id="no-btn">HAYIR</button>
            </div>
        </div>

        <div id="step-2" class="step">
            <h1 class="main-title" style="font-size: 2.5rem;">WUHUHUHUHUHHUUH! 🥳</h1>
            <h3 style="color: #e91e63; margin-bottom: 25px; font-size: 1.5rem;">Peki ne yapmak istersin?</h3>
            
            <input type="hidden" name="kategori" id="selected-category" value="">
            
            <div class="category-buttons">
                <button type="button" class="sub-btn" onclick="selectCategory('Besle Beni 🍕')">BESLE BENİ</button>
                <button type="button" class="sub-btn" onclick="selectCategory('Çay & Kahve & Tatlı ☕')">ÇAY KAHVE TATLI</button>
                <button type="button" class="sub-btn" onclick="selectCategory('Hepsi! ✨')">HEPSİ</button>
            </div>
        </div>

        <div id="step-3" class="step">
            </div>

    </form>

    <script>
        const noBtn = document.getElementById('no-btn');
        
        // Kaçan Buton Fonksiyonu (Hem PC hem Telefon uyumlu)
        function butonunKacmasi() {
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            
            const randomX = Math.floor(Math.random() * Math.max(10, maxX));
            const randomY = Math.floor(Math.random() * Math.max(10, maxY));
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        noBtn.addEventListener('mouseover', butonunKacmasi);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            butonunKacmasi();
        });

        // 🍑 Emojiyi Şekil Olarak Tanımlıyoruz
        const seftali = confetti.shapeFromText({ text: '🍑', scalar: 3 });

        // Sürekli Aşağı Düşen Şeftali Yağmuru Fonksiyonu
        function seftaliYagmuru() {
            const duration = 6 * 1000; // 6 saniye boyunca şeftali yağacak
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 2, 
                    angle: 270, // Yönü direkt aşağı doğru
                    spread: 90,
                    origin: { 
                        x: Math.random(), // Rastgele yatay konum
                        y: -0.1 // Ekranın hemen üstü
                    },
                    shapes: [seftali], 
                    scalar: Math.random() * 1.5 + 1.5, // Rastgele boyutlar
                    gravity: 0.8, // Düşme hızı
                    ticks: 300 
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // Adımlar Arası Geçiş
        function nextStep(stepNumber) {
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('active');
            });
            document.getElementById('step-' + stepNumber).classList.add('active');

            if(stepNumber === 2) {
                seftaliYagmuru(); // "EVET"e basılınca şeftaliler yağmaya başlasın!
            }
        }

        // Kategori Seçme Fonksiyonu
        function selectCategory(categoryName) {
            document.getElementById('selected-category').value = categoryName;
            alert("Harika! Seçtiğin kategori akılda tutuldu: " + categoryName + "\nŞimdi son adım olan gün/saat panelini yapmaya hazırız!");
        }
    </script>
</body>
</html>
